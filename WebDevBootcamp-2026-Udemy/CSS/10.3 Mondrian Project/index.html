<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mondrian Project</title>
    <style>
      body {
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 0;
        margin: 0;
      }
      .container {
        width: 748px;
        height: 748px;
        display: grid;
        grid-template-columns: 320px 198px 153px 50px;
        grid-template-rows: 414px 130px 157px 20px;
        gap: 9px;
        background-color: black;
      }
      .red {
        background-color: #e72f24;
      }
      .blue {
        background-color: #004592;
        border-bottom: 10px solid black;
      }
      .yellow {
        background-color: #f9d01e;
      }
      .grey {
        background-color: #232629;
      }
      .light-grey {
        background-color: #f0f1ec;
      }

      .one {
        grid-column: span 3;
      }
      .two {
        grid-row: span 2;
      }
      .three {
        grid-area: 2 / 2 / 4 / 4;
      }
      .four {
        grid-row: span 2;
      }
      /*
      Write your CSS here
      Gap Colour: #000
      White: #F0F1EC
      Red: #E72F24
      Black: #232629
      Blue: #004592
      Yellow: #F9D01E

      For dimensions, see dimensions.png image.
      HINT: Remember you can't change the properties of grid lines.
      But grid lines are transparent!
      */
    </style>
  </head>

  <body>
    <!-- Write your HTML here -->
    <div class="container">
      <div class="item red"></div>
      <div class="light-grey one"></div>
      <div class="light-grey two"></div>
      <div class="light-grey three"></div>
      <div class="item blue"></div>
      <div class="light-grey four"></div>
      <div class="light-grey five"></div>

      <div class="item yellow"></div>

      <div class="item grey"></div>
    </div>
  </body>
</html>
