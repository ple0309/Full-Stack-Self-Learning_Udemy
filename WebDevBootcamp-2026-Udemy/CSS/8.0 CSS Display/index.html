<!doctype html>
<html>
  <!--

1. By changing only the display property of the CSS make all 3 squares line up horizontally like in goal1 image.
2. Change only the display property to make all 3 squares line up vertically like in goal2 image.

  <head>
    <title>CSS Display Property Example</title>
    <style>
      p {
        color: white;
      }

      .red {
        display: block;
        width: 200px;
        height: 200px;
        background-color: red;
      }

      .green {
        display: block;
        width: 200px;
        height: 200px;
        background-color: green;
      }

      .blue {
        display: block;
        width: 200px;
        height: 200px;
        background-color: blue;
      }
    </style>
  </head>
  <!--
    I learned that in display property will have none, block, inline, and inline-block value.  

    1) Block : will set another element to go below and not be the same line.
    2) Inline : will be the same line. ( can't set size for width and height).
    3) Inline-block : this one allows to set height and width and can be on the same line.
    4) None : any element on the screen disappear.

-->
  <body>
    <h1>CSS Display Property</h1>
    <p class="red">Red Paragraph</p>
    <p class="green">Green Paragraph</p>
    <p class="blue">Blue Paragraph</p>
  </body>
</html>
